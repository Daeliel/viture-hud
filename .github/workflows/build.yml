name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # attach the exe to the release when a v* tag is pushed
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils

      - name: Build and test
        shell: msys2 {0}
        run: cmd //c build.bat

      - uses: actions/upload-artifact@v4
        with:
          name: viture_hud
          path: build/viture_hud.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/viture_hud.exe
